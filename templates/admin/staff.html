{% extends "base.html" %}{% block content %}<h1>Staff Management</h1><div class="panel"><h2>Create Billing Staff</h2><form method="post" class="formgrid"><input name="username" placeholder="Staff username" required><input name="password" placeholder="Password (min 4 chars)" required><button>Create Staff</button></form></div><div class="tablewrap"><table><tr><th>ID</th><th>Username</th><th>Role</th><th>Action</th></tr>{% for s in staff %}<tr><td>{{s.id}}</td><td>{{s.username}}</td><td><span class="badge">{{s.role}}</span></td><td><form method="post" action="{{url_for('delete_staff',uid=s.id)}}" class="inline" onsubmit="return confirm('Delete this staff account?')"><button class="btn-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No staff accounts.</td></tr>{% endfor %}</table></div>{% endblock %}

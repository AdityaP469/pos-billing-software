{% extends "base.html" %}{% block content %}<div class="pagehead"><div><h1>Product Management</h1><p class="muted">Complete product CRUD with stock control.</p></div></div><div class="panel"><form method="get" class="searchbar"><input name="q" value="{{q}}" placeholder="Search name, SKU or category"><button>Search</button></form></div>
<div class="panel"><h2>Add Product</h2><form method="post" action="{{url_for('add_product')}}" class="formgrid"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category"><input name="sku" placeholder="SKU" required><input name="price" type="number" min="0" step="0.01" placeholder="Price" required><input name="stock" type="number" min="0" placeholder="Stock" required><button>Add Product</button></form></div>
<div class="tablewrap"><table><tr><th>Name</th><th>Category</th><th>SKU</th><th>Price</th><th>Stock</th><th>Actions</th></tr>{% for p in products %}<tr><form method="post" action="{{url_for('edit_product',pid=p.id)}}"><td><input name="name" value="{{p.name}}" required></td><td><input name="category" value="{{p.category or ''}}"></td><td><input name="sku" value="{{p.sku}}" required></td><td><input name="price" value="{{p.price}}" type="number" min="0" step=".01"></td><td><input name="stock" value="{{p.stock}}" type="number" min="0"></td><td><button>Save</button></form><form method="post" action="{{url_for('delete_product',pid=p.id)}}" class="inline" onsubmit="return confirm('Delete this product?')"><button class="btn-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No products found.</td></tr>{% endfor %}</table></div>{% endblock %}

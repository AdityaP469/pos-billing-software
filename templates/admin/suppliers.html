{% extends "base.html" %}{% block content %}<h1>Supplier Management</h1><div class="panel"><h2>Add Supplier</h2><form method="post" class="formgrid"><input name="name" placeholder="Supplier name" required><input name="phone" placeholder="Phone"><input name="email" type="email" placeholder="Email"><input name="address" placeholder="Address"><button>Add Supplier</button></form></div><div class="tablewrap"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>Actions</th></tr>{% for s in suppliers %}<tr><form method="post" action="{{url_for('edit_supplier',sid=s.id)}}"><td><input name="name" value="{{s.name}}" required></td><td><input name="phone" value="{{s.phone or ''}}"></td><td><input name="email" value="{{s.email or ''}}" type="email"></td><td><input name="address" value="{{s.address or ''}}"></td><td><button>Save</button></form><form method="post" action="{{url_for('delete_supplier',sid=s.id)}}" class="inline" onsubmit="return confirm('Delete this supplier?')"><button class="btn-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No suppliers found.</td></tr>{% endfor %}</table></div>{% endblock %}
